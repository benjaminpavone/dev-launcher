# Builds the Windows installer and attaches it to a draft GitHub Release.
# Trigger: push a tag matching the app version, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installers

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dev Launcher ${{ github.ref_name }}"
          releaseBody: |
            - `dev-launcher_<version>_portable.exe`: download and run, nothing to install (needs WebView2, built into Windows 10 and 11).
            - `dev-launcher_<version>_x64-setup.exe`: installer, with a Start menu shortcut and an uninstaller.

            The app is not code-signed: Windows SmartScreen may show "Windows protected your PC". Click "More info", then "Run anyway".
            See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: false

      - name: Attach the portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="dev-launcher_${GITHUB_REF_NAME#v}_portable.exe"
          cp src-tauri/target/release/dev-launcher.exe "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber
