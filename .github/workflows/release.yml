# Builds the Windows installers and the macOS dmg, and attaches them to a draft GitHub Release.
# Trigger: push a tag matching the app version, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installers

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dev Launcher ${{ github.ref_name }}"
          releaseBody: |
            - `dev-launcher_<version>_portable.exe`: download and run, nothing to install (needs WebView2, built into Windows 10 and 11).
            - `dev-launcher_<version>_x64-setup.exe`: installer, with a Start menu shortcut and an uninstaller.

            - `dev-launcher_<version>_universal.dmg`: macOS (Intel and Apple Silicon). Open it and drag Dev Launcher to Applications.

            The app is not code-signed: Windows SmartScreen may show "Windows protected your PC". Click "More info", then "Run anyway".
            On macOS, the first launch is blocked: open System Settings → Privacy & Security and click "Open Anyway".
            See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: false

      - name: Attach the portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="dev-launcher_${GITHUB_REF_NAME#v}_portable.exe"
          cp src-tauri/target/release/dev-launcher.exe "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber

  build-macos:
    # Runs after the Windows job, which creates the draft release
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build the universal app (Intel and Apple Silicon)
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - name: Attach the dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
